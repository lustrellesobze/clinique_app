<div class="splash-screen">

  <!-- Logo stéthoscope animé -->
  <div class="stethoscope-wrapper">

    <!-- Moitié gauche -->
    <div class="stethoscope-left">
      <svg width="80" height="130" viewBox="0 0 80 130" fill="none">
        <circle cx="22" cy="14" r="8" fill="none"
                stroke="var(--secondary)" stroke-width="3.5"/>
        <path d="M22 22 C22 55, 8 78, 8 100"
              stroke="var(--secondary)" stroke-width="3.5"
              stroke-linecap="round" fill="none"/>
        <path d="M8 100 Q8 128, 40 128"
              stroke="var(--secondary)" stroke-width="4"
              stroke-linecap="round" fill="none"/>
      </svg>
    </div>

    <!-- Moitié droite -->
    <div class="stethoscope-right">
      <svg width="80" height="130" viewBox="0 0 80 130" fill="none">
        <circle cx="58" cy="14" r="8" fill="none"
                stroke="var(--secondary)" stroke-width="3.5"/>
        <path d="M58 22 C58 55, 72 78, 72 100"
              stroke="var(--secondary)" stroke-width="3.5"
              stroke-linecap="round" fill="none"/>
        <path d="M72 100 Q72 128, 40 128"
              stroke="var(--secondary)" stroke-width="4"
              stroke-linecap="round" fill="none"/>
      </svg>
    </div>

    <!-- Membrane centrale (chest piece) -->
    <div class="chest-piece">
      <svg width="40" height="40" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="17" fill="var(--accent)" opacity="0.15"/>
        <circle cx="20" cy="20" r="12" fill="none"
                stroke="var(--accent)" stroke-width="3"/>
        <circle cx="20" cy="20" r="5" fill="var(--accent)"/>
      </svg>
    </div>
  </div>

  <!-- Titre -->
  <div class="splash-title">
    <h1>Clinique Espoir</h1>
    <p class="tagline">SYSTÈME DE FACTURATION</p>
  </div>

  <!-- Sous-titre -->
  <p class="splash-subtitle">
    Gestion financière complète de votre clinique
  </p>

  <!-- Bouton -->
  <button class="btn-connect" type="button" (click)="goToLogin()">
    Se connecter
  </button>

  <!-- Version -->
  <span class="version">Version 1.0 · 2026</span>

</div>
