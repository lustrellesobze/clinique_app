<div class="login-page">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <div class="logo-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
             stroke="var(--secondary)" stroke-width="2.2" stroke-linecap="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </div>
      <h1>Connexion</h1>
      <p>Clinique Espoir</p>
    </div>

    <!-- Formulaire -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email">Email ou identifiant</label>
        <input id="email" type="email" formControlName="email"
               placeholder="accueil@demo.cm"
               [class.input-error]="email?.invalid && email?.touched"/>
        <span class="error-msg"
              *ngIf="email?.invalid && email?.touched">
          Email invalide
        </span>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'"
                 id="password" formControlName="password"
                 placeholder="••••••••••"
                 [class.input-error]="password?.invalid && password?.touched"/>
          <button type="button" class="toggle-pw"
                  (click)="showPassword = !showPassword">
            {{ showPassword ? '🙈' : '👁' }}
          </button>
        </div>
      </div>

      <!-- Message d'erreur global -->
      <div class="alert-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-login"
              [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Se connecter</span>
        <span *ngIf="isLoading">Connexion...</span>
      </button>

    </form>

    <div class="login-footer">
      <a routerLink="/forgot-password">Mot de passe oublié ?</a>
    </div>

    <div class="login-dev-hint" *ngIf="devDemoHint">
      <p>
        Comptes démo : <code>{{ demoEmailExamples }}</code> — mot de passe commun :
        <code>{{ demoPassword }}</code>
      </p>
      <p class="login-dev-hint__cmd">Backend : <code>python scripts/create_test_user.py</code></p>
    </div>

    <div class="login-meta">
      Version 1.0 · © 2026 Clinique Espoir
    </div>

  </div>
</div>
