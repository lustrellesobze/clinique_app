<div class="notification-bell" (clickOutside)="closeDropdown()">
  <button class="bell-button" (click)="toggleDropdown()" [class.has-notifications]="unreadCount > 0">
    <span class="bell-icon">🔔</span>
    <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
  </button>

  <div class="notification-dropdown" *ngIf="showDropdown">
    <div class="dropdown-header">
      <h3>Notifications</h3>
      <button class="mark-all-read" *ngIf="unreadCount > 0" (click)="markAllAsRead()">
        Tout marquer comme lu
      </button>
    </div>

    <div class="notification-list" *ngIf="!loading && notifications.length > 0">
      <div 
        *ngFor="let notification of notifications" 
        class="notification-item"
        [class.unread]="!notification.est_lue"
        (click)="markAsRead(notification, $event)"
      >
        <div class="notification-icon">{{ getNotificationIcon(notification.type_notification) }}</div>
        <div class="notification-content">
          <div class="notification-title">{{ notification.titre }}</div>
          <div class="notification-message">{{ notification.message }}</div>
          <div class="notification-time">{{ getTimeAgo(notification.created_at) }}</div>
        </div>
        <button class="delete-btn" (click)="deleteNotification(notification.id, $event)" title="Supprimer">
          ✕
        </button>
      </div>
    </div>

    <div class="notification-empty" *ngIf="!loading && notifications.length === 0">
      <span class="empty-icon">📭</span>
      <p>Aucune notification</p>
    </div>

    <div class="notification-loading" *ngIf="loading">
      <span class="loading-spinner">⏳</span>
      <p>Chargement...</p>
    </div>
  </div>
</div>
