# CI — tests backend (pytest + MySQL) et compilation frontend
# Le déploiement (CD) est géré séparément par vous.

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: clinique_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: mysql+pymysql://root:test_root@127.0.0.1:3306/clinique_test?charset=utf8mb4
      SECRET_KEY: ci-test-secret-key-at-least-32-characters-long!!
      GOOGLE_CLIENT_ID: ""
      GOOGLE_ACCUEIL_AUTH_ENABLED: "false"
      CAMPAY_BASE_URL: https://demo.campay.net

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if python -c "import pymysql; pymysql.connect(host='127.0.0.1', user='root', password='test_root', database='clinique_test')"; then
              echo "MySQL ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL not ready"
          exit 1

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v --tb=short

  frontend-build:
    name: Frontend — build Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (development)
        run: npm run build -- --configuration=development
